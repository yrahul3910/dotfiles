# Language toolchains, installed by `mise install` from setup.sh.
# Everything tracks the newest release except Python; `mise upgrade` updates them.
[tools]
node = "latest"
# rust-analyzer and rust-src are what editors need; the default profile omits them. The first entry is the default
# toolchain. nightly is only there for `cargo +nightly fmt`, so it gets just rustfmt; mise keeps rustup's `nightly`
# pointed at the dated nightly it installs.
rust = [
  { version = "latest", components = ["rust-analyzer", "rust-src"], mr_boxington = true },
  { version = "nightly", profile = "minimal", components = ["rustfmt"] },
]
python = "latest"
uv = "latest"
mr-boxington = "latest"

[settings]
# mise exports RUSTUP_TOOLCHAIN, which outranks a project's rust-toolchain.toml.
# Reading that file lets a project's own pin win inside its directory.
idiomatic_version_file_enable_tools = ["rust"]
# Download the free-threaded CPython build instead of the default GIL build.
python.precompiled_flavor = "freethreaded+pgo+lto"
minimum_release_age = "0s"
