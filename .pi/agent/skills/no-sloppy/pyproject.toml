[project]
name = "no-sloppy"
version = "0.1.0"
description = "Anti-slop checker for Python: an opinionated ruff overlay plus custom slop rules, scoped to changed lines"
requires-python = ">=3.14"

[project.scripts]
no-sloppy = "no_sloppy.check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

